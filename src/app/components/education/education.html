<section id="education" class="relative py-24 overflow-hidden">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div [appScrollReveal]="0">
      <h2 class="text-3xl sm:text-4xl font-bold mb-2 t-heading">
        <span class="gradient-text">Education</span>
      </h2>
      <div class="section-divider"></div>
    </div>

    <div [appScrollReveal]="100" class="max-w-2xl mx-auto">
      <div class="glass rounded-2xl p-8 hover:-translate-y-1 transition-transform duration-300 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-violet-500/10 to-transparent rounded-bl-full"></div>
        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-4">
            <div class="p-3 rounded-xl bg-violet-500/10">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-violet-400"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16c0 1 2.69 3 6 3s6-2 6-3v-3.5"/></svg>
            </div>
            <span class="text-xs font-mono px-3 py-1 rounded-full t-badge">2020 – 2024</span>
          </div>
          <h3 class="text-xl font-bold mb-1 t-heading">University of Mumbai</h3>
          <p class="text-violet-400 font-medium mb-3">Bachelor of Engineering in Information Technology</p>
          <div class="flex items-center gap-2">
            <span class="text-2xl font-bold gradient-text">9.06</span>
            <span class="text-sm t-muted">/ 10 CGPA</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
