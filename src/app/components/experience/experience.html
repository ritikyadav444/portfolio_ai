<section id="experience" class="relative py-24 overflow-hidden">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div [appScrollReveal]="0">
      <h2 class="text-3xl sm:text-4xl font-bold mb-2 t-heading">
        Work <span class="gradient-text">Experience</span>
      </h2>
      <div class="section-divider"></div>
    </div>

    <div class="relative mt-12">
      <div class="timeline-line"></div>

      @for (job of jobs; track job.company; let i = $index; let even = $even) {
        <div class="relative pl-12 md:pl-0 mb-16" [appScrollReveal]="i * 150">
          <div class="timeline-dot" [class.dot-dark]="isDark()" [class.dot-light]="!isDark()"></div>

          <div [class]="even
            ? 'md:w-[calc(50%_-_2rem)]'
            : 'md:ml-[calc(50%_+_2rem)] md:w-[calc(50%_-_2rem)]'">
            <div class="glass rounded-2xl p-6 sm:p-8 hover:-translate-y-1 transition-transform duration-300">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div>
                  <h3 class="text-xl font-bold t-heading">{{ job.company }}</h3>
                  <p class="text-violet-400 font-medium text-sm">{{ job.role }}</p>
                </div>
                <span class="text-xs font-mono px-3 py-1 rounded-full t-badge">
                  {{ job.period }}
                </span>
              </div>
              <ul class="flex flex-col gap-3 text-sm leading-relaxed t-body">
                @for (bullet of job.bullets; track $index) {
                  <li class="flex gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-violet-400 mt-0.5 flex-shrink-0"><path d="m9 18 6-6-6-6"/></svg>
                    <span [innerHTML]="bullet"></span>
                  </li>
                }
              </ul>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
