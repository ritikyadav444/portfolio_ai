<section id="leadership" class="relative py-24 overflow-hidden">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div [appScrollReveal]="0">
      <h2 class="text-3xl sm:text-4xl font-bold mb-2 t-heading">
        <span class="gradient-text">Leadership</span>
      </h2>
      <div class="section-divider"></div>
    </div>

    <div class="grid md:grid-cols-2 gap-8 mt-8">
      @for (role of roles; track role.title; let i = $index) {
        <div [appScrollReveal]="i * 150">
          <div class="glass rounded-2xl p-6 sm:p-8 hover:-translate-y-1 transition-transform duration-300 h-full">
            <div class="flex items-center gap-3 mb-4">
              <div [class]="'p-3 rounded-xl ' + role.iconBg">
                @if (i === 0) {
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class]="role.iconColor"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class]="role.iconColor"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                }
              </div>
            </div>
            <h3 class="text-xl font-bold mb-1 t-heading">{{ role.title }}</h3>
            <p [class]="'font-medium text-sm mb-4 ' + role.orgColor">{{ role.org }}</p>
            <p class="text-sm leading-relaxed t-muted" [innerHTML]="role.description"></p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
