<nav
  class="fixed top-0 w-full z-50 transition-all duration-300"
  [class.nav-scrolled]="scrolled()"
  [class.nav-scrolled-dark]="scrolled() && isDark()"
  [class.nav-scrolled-light]="scrolled() && !isDark()"
>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="#" class="text-2xl font-bold gradient-text tracking-tight">RY</a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            (click)="scrollTo($event, link.href)"
            class="nav-link text-sm font-medium transition-colors t-nav-link"
          >{{ link.label }}</a>
        }
      </div>

      <div class="flex items-center gap-3">
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-lg transition-colors cursor-pointer t-btn-hover t-icon-link"
          aria-label="Toggle theme"
        >
          @if (isDark()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          }
        </button>

        <button
          (click)="toggleMobile()"
          class="md:hidden p-2 rounded-lg transition-colors cursor-pointer t-btn-hover t-icon-link"
          aria-label="Menu"
        >
          @if (mobileMenuOpen()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          }
        </button>
      </div>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div class="md:hidden glass border-t border-white/10">
      <div class="px-4 py-4 flex flex-col gap-3">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            (click)="scrollTo($event, link.href)"
            class="block text-sm font-medium py-2 t-nav-link"
          >{{ link.label }}</a>
        }
      </div>
    </div>
  }
</nav>
