<button
  class="chat-bubble"
  (click)="toggleChat()"
  [class.hidden]="isOpen()"
  aria-label="Open chatbot"
>
  <div class="pulse-ring"></div>
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
</button>

<div class="chat-panel" [class.open]="isOpen()">
  <div class="chat-header">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-r from-violet-500 to-cyan-500 flex items-center justify-center text-white text-xs font-bold">RY</div>
      <div>
        <h4 class="text-sm font-semibold t-heading">Ask about Ritik</h4>
        <p class="text-xs t-muted">AI-powered resume assistant</p>
      </div>
    </div>
    <button (click)="closeChat()" class="p-1.5 rounded-lg transition-colors cursor-pointer t-btn-hover t-icon-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div class="chat-messages" #messagesContainer>
    @for (msg of messages(); track $index) {
      <div [class]="'chat-msg ' + msg.sender">
        {{ msg.text }}
      </div>
    }

    @if (showSuggestions()) {
      <div class="flex flex-wrap gap-2 mt-1">
        @for (q of suggestedQuestions; track q) {
          <button class="suggested-q" (click)="askSuggested(q)">{{ q }}</button>
        }
      </div>
    }

    @if (isTyping()) {
      <div class="chat-msg bot">
        <span class="typing-indicator">
          <span></span><span></span><span></span>
        </span>
      </div>
    }
  </div>

  <div class="chat-input-area">
    <form (submit)="onSubmit($event)" class="flex gap-2">
      <input
        type="text"
        [value]="inputText()"
        (input)="updateInput($event)"
        placeholder="Ask about Ritik..."
        class="chat-input flex-1"
        autocomplete="off"
      />
      <button type="submit" class="p-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-cyan-500 text-white hover:shadow-lg hover:shadow-violet-500/25 transition-all cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </div>
</div>
